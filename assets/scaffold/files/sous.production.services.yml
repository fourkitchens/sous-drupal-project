# Non-local runtimes use production-safe Twig and response defaults.
parameters:
  # Core's UI development switches live in key/value storage, not configuration.
  # Do not let flags copied in a local database override this non-local policy.
  # Projects with other collection mappings must retain them in this owned file.
  factory.keyvalue:
    default: keyvalue.database
    development_settings: sous.keyvalue.development_settings
  http.response.debug_cacheability_headers: false
  twig.config:
    debug: false
    auto_reload: false
    cache: true
services:
  sous.keyvalue.development_settings:
    class: Drupal\Core\KeyValueStore\KeyValueMemoryFactory

# Run composer ci to validate and build this site.
# The steps live in composer.json; change them there.
version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  build:
    docker:
      # Same PHP as .ddev/config.yaml; this image includes Composer 2.
      - image: cimg/php:8.4
    environment:
      HUSKY: '0'
    steps:
      - checkout
      - node/install
      - restore_cache:
          keys:
            - deps-v1-{{ checksum "composer.lock" }}-{{ checksum "package-lock.json" }}
      - run:
          name: Check the site
          # CircleCI has no total job timeout; bound the shared command's run time.
          command: timeout 30m composer ci
          no_output_timeout: 30m
      - save_cache:
          key: deps-v1-{{ checksum "composer.lock" }}-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/composer
            - ~/.npm

  release:
    docker:
      - image: cimg/php:8.4
    environment:
      HUSKY: '0'
    steps:
      - checkout:
          method: full
      - node/install
      - run:
          name: Publish the release
          command: |
            if [ -z "${GITHUB_TOKEN:-}" ]; then
              echo "Add GITHUB_TOKEN in CircleCI project settings to publish releases."
              exit 0
            fi
            npm ci
            npm run release

  # Supply host delivery and alias credentials; see docs/DEPLOYMENT.md.
  # deploy:
  #   docker:
  #     - image: cimg/php:8.4
  #   environment:
  #     HUSKY: '0'
  #   steps:
  #     - checkout
  #     - node/install
  #     - run: timeout 30m composer build-assets
  #     # Deliver the build to your host here.
  #     - run: vendor/bin/drush @your-site.env deploy -y

workflows:
  # Project triggers select pull requests/main pushes; manual runs use this too.
  build:
    jobs:
      - build
      # When you enable deploy, make release depend on it so tags mark what is live.
      - release:
          requires: [build]
          filters:
            branches:
              only: main
      # - deploy:
      #     requires: [build]
      #     filters:
      #       branches:
      #         only: main

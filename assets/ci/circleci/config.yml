# Copy to .circleci/config.yml in the generated site's own repository.
# Keep site checks in composer ci so local and CI runs use the same commands.
version: 2.1

orbs:
  node: circleci/node@7.2.1

jobs:
  build:
    docker:
      - image: cimg/php:8.4
    steps:
      - checkout
      - node/install
      - run:
          name: Validate and build the generated site
          command: composer ci

workflows:
  build:
    jobs:
      - build

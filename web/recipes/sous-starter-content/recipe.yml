name: 'Sous Starter Content'
description: 'Supply Page and Frontpage authoring, URL aliases, and native management Views for full Sous sites.'
type: 'Site'
recipes:
  - sous-content-types
install:
  - block_content
  - login_history
  - menu_ui
  - path
  - pathauto
  - taxonomy
  - views
config:
  # Import missing provider defaults without replacing project customizations.
  strict: false
  import:
    block_content:
      - views.view.block_content
    node:
      - views.view.content
      - views.view.glossary
    file:
      - views.view.files
    media:
      - views.view.media
    media_library:
      - views.view.media_library
    taxonomy:
      - views.view.taxonomy_term
    user:
      - views.view.who_s_new
      - views.view.who_s_online
    login_history:
      - views.view.login_history
  actions:
    core.entity_form_display.node.page.default:
      setComponent:
        name: path
        options:
          type: path
          weight: 30
          region: content
          settings: { }
          third_party_settings: { }

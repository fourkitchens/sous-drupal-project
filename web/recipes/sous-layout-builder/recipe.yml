name: 'Sous Layout Builder'
description: 'Enable native Page layouts while preserving visible fields and allowing per-page customization.'
type: 'Site'
recipes:
  - sous-content-types
  - core/recipes/basic_block_type
install:
  - block
  - contextual
  - field_ui
  - layout_discovery
  - layout_builder
config:
  actions:
    core.entity_view_display.node.page.default:
      # Native entity saves convert existing formatters to field blocks.
      enableLayoutBuilder: []
      allowLayoutOverrides: true

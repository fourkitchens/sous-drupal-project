name: 'Sous Layout Builder'
description: 'Enable native Page and Frontpage layouts while retaining visible fields and per-page customization.'
type: 'Site'
recipes:
  - sous-starter-content
  - core/recipes/basic_block_type
install:
  - block
  - contextual
  - field_ui
  - layout_discovery
  - layout_builder
config:
  actions:
    core.entity_view_display.node.page.default:
      # Native entity saves convert existing formatters to field blocks.
      enableLayoutBuilder: []
      allowLayoutOverrides: true
    core.entity_view_display.node.frontpage.default:
      enableLayoutBuilder: []
      allowLayoutOverrides: true

name: 'Sous Starter Paragraphs'
description: 'Extend both starter content types with the shared Sous Paragraphs components.'
type: 'Site'
recipes:
  - sous-starter-content
  - sous-paragraphs
config:
  actions:
    core.entity_form_display.node.page.default:
      simpleConfigUpdate:
        third_party_settings.field_group.group_content.children:
          - body
          - field_content
    core.entity_form_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: paragraphs
          weight: 122
          region: content
          settings:
            title: Component
            title_plural: Components
            edit_mode: open
            closed_mode: summary
            autocollapse: none
            closed_mode_threshold: 0
            add_mode: dropdown
            form_display_mode: default
            default_paragraph_type: _none
            features:
              add_above: add_above
              collapse_edit_all: collapse_edit_all
          third_party_settings: { }
      simpleConfigUpdate:
        third_party_settings.field_group.group_content.children:
          - body
          - field_content
    core.entity_view_display.node.frontpage.default:
      setComponent:
        name: field_content
        options:
          type: entity_reference_revisions_entity_view
          label: hidden
          weight: 10
          region: content
          settings:
            view_mode: default
            link: ''
          third_party_settings: { }

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: npm
    # The installer adds the generated theme directory to this list.
    directories: [/]
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
    groups:
      drupal-core:
        patterns: ['drupal/core*']
        update-types: [minor, patch]
      composer:
        patterns: ['*']
        exclude-patterns: ['drupal/core*']
        update-types: [minor, patch]
    ignore:
      - dependency-name: 'drupal/core*'
        update-types: ['version-update:semver-major']

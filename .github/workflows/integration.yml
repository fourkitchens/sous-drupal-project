name: Shared Sous integration

on:
  workflow_call:
    inputs:
      packages_ref:
        description: Optional full reviewed packages commit for validation-only candidate ZIPs
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Initialize diagnostic artifacts
        id: artifacts
        shell: bash
        run: |
          artifacts="$RUNNER_TEMP/sous-integration-results"
          mkdir -p "$artifacts"
          printf 'result-path=%s\n' "$artifacts" >> "$GITHUB_OUTPUT"
          printf 'Artifact collection initialized before checkout and DDEV setup.\n' > "$artifacts/workflow-setup.txt"
      - name: Check out the caller revision under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
      - name: Install reviewed DDEV
        uses: ddev/github-action-setup-ddev@fdf2f5c97943bae638f31df6df86f1defa6210c0 # v1.12.1
        with:
          version: '1.25.4'
          autostart: false
          installScriptUrl: https://raw.githubusercontent.com/ddev/ddev/5da91aeb9ebab0b0e66171c450b72099308d332c/scripts/install_ddev.sh
      - name: Validate the integrated product
        id: integration
        uses: $/.github/actions/integration
        with:
          subject: ${{ github.workspace }}/subject
          subject_repository: ${{ github.repository }}
          packages_ref: ${{ inputs.packages_ref }}
      - name: Upload integration diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sous-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.integration.outputs.result-path || steps.artifacts.outputs.result-path }}
          if-no-files-found: error
          retention-days: 7

name: Sous CI

on:
  push:
    branches: [main, next, next-major, alpha, beta, '*.x', 'codex/**']
  pull_request:
    branches: [main, next, next-major, alpha, beta, '*.x']
  workflow_dispatch:
    inputs:
      packages_ref:
        description: Optional full reviewed packages commit (validation only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    # Same-name Sous forks run product CI; renamed generated sites configure app CI.
    if: endsWith(github.repository, '/sous-drupal-project')
    uses: ./.github/workflows/integration.yml
    with:
      packages_ref: ${{ inputs.packages_ref || '' }}
  release:
    needs: integration
    # Paired companion refs validate only; publication uses merged dependencies.
    if: github.repository == 'fourkitchens/sous-drupal-project' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.packages_ref
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

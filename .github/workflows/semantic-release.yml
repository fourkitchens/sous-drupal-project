name: Sous CI

on:
  push:
    branches: [main, next, next-major, alpha, beta, '*.x']
  pull_request:
    branches: [main, next, next-major, alpha, beta, '*.x']
  workflow_dispatch:
    inputs:
      packages_ref:
        description: Optional full reviewed packages commit (validation only)
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source checks
    # Same-name Sous forks run product CI; generated sites configure their own CI.
    if: endsWith(github.repository, '/sous-drupal-project')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - name: Check out the source under review
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up reviewed PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Set up reviewed Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install reviewed npm
        run: npm install --global npm@11.21.1
      - name: Install locked source tools
        run: npm ci --include=dev
      - name: Lint and check starter workflows
        run: bash devops/tests/check.sh

  integration:
    needs: checks
    # Keep installation, theme, environment and recovery coverage before release.
    if: endsWith(github.repository, '/sous-drupal-project') && github.event_name != 'pull_request'
    uses: ./.github/workflows/integration.yml
    with:
      packages_ref: ${{ inputs.packages_ref || '' }}

  release:
    needs: [checks, integration]
    # Paired companion refs validate only; publication uses merged dependencies.
    if: github.repository == 'fourkitchens/sous-drupal-project' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.packages_ref
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

name: Sous CI

on:
  push:
    branches: [main, next, next-major, alpha, beta, '*.x']
  pull_request:
    branches: [main, next, next-major, alpha, beta, '*.x']
  workflow_dispatch:
    inputs:
      recipe_refs:
        description: Optional JSON object mapping companion recipe names to reviewed Git refs
        required: false
        type: string
        default: '{}'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    # Same-name Sous forks run product CI; renamed generated sites configure app CI.
    if: endsWith(github.repository, '/sous-drupal-project')
    uses: ./.github/workflows/integration.yml
    with:
      recipe_refs: ${{ inputs.recipe_refs || '{}' }}
  release:
    needs: integration
    # Paired companion refs validate only; publication uses merged dependencies.
    if: github.repository == 'fourkitchens/sous-drupal-project' && github.event_name != 'pull_request' && (!inputs.recipe_refs || inputs.recipe_refs == '{}')
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
